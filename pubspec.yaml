name: aulas_flutter
description: "UNICAP — transporte universitário, viagens e embarques."
publish_to: 'none'
version: 2.0.0+2
environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  geolocator: ^12.0.0
  flutter_map: 8.2.2
  url_launcher: ^6.3.2
  latlong2: ^0.9.1
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  wakelock_plus: ^1.8.1
  screen_brightness: ^2.1.11
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: DejaVuSans
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
  assets:
    - assets/logo_unicap.png
    - assets/onibus_referencia.png
    - assets/logo.jpeg
    - assets/onibusPreto.png
    - assets/onibusAzul.png
    - assets/onibusLaranja.png
