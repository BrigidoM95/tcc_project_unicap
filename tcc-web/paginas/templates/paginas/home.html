<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home Administrativa</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #111827;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .cabecalho {
            background: white;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-bottom: 25px;
        }

        .cabecalho h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 40px;
        }

        .cabecalho p {
            margin-bottom: 0;
            font-size: 18px;
            color: #6b7280;
        }

        .modulos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .modulo {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 30px;
        }

        .modulo h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .modulo p {
            color: #6b7280;
            line-height: 1.5;
            min-height: 48px;
        }

        .botao {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .botao-principal {
            background: #153b73;
            color: white;
        }

        .botao-principal:hover {
            background: #0f2d58;
        }

        .rodape {
            margin-top: 25px;
            text-align: right;
        }

        .botao-sair {
            background: #e5e7eb;
            color: #111827;
        }

        @media (max-width: 750px) {
            body {
                padding: 20px;
            }

            .modulos {
                grid-template-columns: 1fr;
            }

            .cabecalho h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <header class="cabecalho">

        <h1>Home Administrativa</h1>

        <p>
            Gerenciamento do sistema de transporte universitário.
        </p>

    </header>


    <section class="modulos">

        <!-- MÓDULO 1 -->

        <article class="modulo">

            <h2>Usuários</h2>

            <p>
                Cadastro, edição, inativação e gerenciamento
                dos usuários do sistema.
            </p>

            <a
                href="{% url 'listar_usuarios' %}"
                class="botao botao-principal"
            >
                Gerenciar Usuários
            </a>

        </article>


        <!-- MÓDULO 2 -->

        <article class="modulo">

            <h2>Ônibus</h2>

            <p>
                Cadastro, edição, motorista, capacidade
                e gerenciamento dos veículos.
            </p>

            <a
                href="{% url 'listar_onibus' %}"
                class="botao botao-principal"
            >
                Gerenciar Ônibus
            </a>

        </article>

    </section>


    <div class="rodape">

        <a
            href="{% url 'logout' %}"
            class="botao botao-sair"
        >
            Sair
        </a>

    </div>

</main>

</body>

</html>
