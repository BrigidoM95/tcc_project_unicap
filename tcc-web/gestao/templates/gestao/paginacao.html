{% if objetos.has_other_pages %}<nav class="acoes" aria-label="Paginação">{% if objetos.has_previous %}<a class="botao secundario" href="?{{ parametros }}&pagina={{ objetos.previous_page_number }}">Anterior</a>{% endif %}<span>Página {{ objetos.number }} de {{ objetos.paginator.num_pages }}</span>{% if objetos.has_next %}<a class="botao secundario" href="?{{ parametros }}&pagina={{ objetos.next_page_number }}">Próxima</a>{% endif %}</nav>{% endif %}
